<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapFuel Vehicles</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f3efe6;
            --bg-accent: #d8c3a5;
            --panel: rgba(255, 250, 242, 0.92);
            --border: #d9c6b1;
            --text: #2f241c;
            --muted: #6b5a4b;
            --primary: #a44a3f;
            --success: #2f7d4a;
            --shadow: 0 22px 60px rgba(72, 42, 22, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.65), transparent 28%),
                linear-gradient(135deg, var(--bg), #ead8bf 55%, var(--bg-accent));
            color: var(--text);
            font-family: Aptos, "Trebuchet MS", sans-serif;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 28px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 22px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 2.8rem);
            letter-spacing: -0.05em;
        }

        .subtitle,
        .status,
        .helper {
            color: var(--muted);
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-link,
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 11px 18px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 700;
            border: 1px solid var(--border);
        }

        .menu-link {
            background: rgba(255, 253, 248, 0.72);
            color: var(--text);
        }

        button {
            background: var(--primary);
            color: #fffaf5;
            cursor: pointer;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .add-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            margin-bottom: 18px;
            align-items: center;
        }

        input {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 11px 12px;
            font: inherit;
            color: var(--text);
            background: rgba(255, 253, 248, 0.95);
        }

        .threshold-grid {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .threshold-grid label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .add-threshold-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .vehicle-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-row {
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .checkbox-row input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: var(--primary);
        }

        .vehicle-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 10px;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.55);
        }

        .badge {
            display: inline-block;
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 6px;
        }

        .badge-active {
            background: #d9efdf;
            color: var(--success);
        }

        .badge-inactive {
            background: #e8ded2;
            color: #765948;
        }

        @media (max-width: 640px) {

            .vehicle-row,
            .add-row,
            header,
            .threshold-grid,
            .add-threshold-grid {
                grid-template-columns: 1fr;
                display: grid;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div>
                <h1>Vehicle Options</h1>
                <div class="subtitle">Manage the names shown in the fuel-entry vehicle picker.</div>
            </div>
            <div class="toolbar">
                <a class="menu-link" href="/">Review Queue</a>
                <a class="menu-link" href="/report.html">Report</a>
                <a class="menu-link" href="/log.html">Log</a>
            </div>
        </header>

        <div id="status" class="status">Loading vehicles…</div>

        <section class="panel">
            <div class="add-row">
                <div>
                    <input id="newVehicleName" type="text" placeholder="Add a vehicle name" />
                    <label class="checkbox-row">
                        <input id="newVehicleNoOdometer" type="checkbox" />
                        No Odometer
                    </label>
                    <div class="add-threshold-grid">
                        <label>
                            Max Gallons (optional)
                            <input id="newVehicleMaxGallons" type="number" min="0" step="0.01"
                                placeholder="e.g. 21.5" />
                        </label>
                        <label>
                            Max MPG (optional)
                            <input id="newVehicleMaxMpg" type="number" min="0" step="0.01" placeholder="e.g. 50" />
                        </label>
                    </div>
                </div>
                <button id="addVehicleButton" type="button">Add vehicle</button>
            </div>

            <div id="vehicleManagerList" class="vehicle-list"></div>
        </section>
    </div>

    <script src="/vehicles.js"></script>
</body>

</html>
