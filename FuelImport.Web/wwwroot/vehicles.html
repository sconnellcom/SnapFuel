<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapFuel Vehicles</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f3efe6;
            --bg-accent: #d8c3a5;
            --panel: rgba(255, 250, 242, 0.92);
            --border: #d9c6b1;
            --text: #2f241c;
            --muted: #6b5a4b;
            --primary: #a44a3f;
            --success: #2f7d4a;
            --shadow: 0 22px 60px rgba(72, 42, 22, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.65), transparent 28%),
                linear-gradient(135deg, var(--bg), #ead8bf 55%, var(--bg-accent));
            color: var(--text);
            font-family: Aptos, "Trebuchet MS", sans-serif;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px;
        }

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .site-title-group h1 {
            margin: 0;
            font-size: clamp(1.9rem, 3.5vw, 2.7rem);
            letter-spacing: -0.05em;
        }

        .subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .status,
        .helper {
            color: var(--muted);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .site-nav {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 253, 248, 0.65);
            padding: 4px;
            border-radius: 999px;
            border: 1px solid var(--border);
        }

        .menu-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 16px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--muted);
            border: 1px solid transparent;
            transition: all 150ms ease;
        }

        .menu-link:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.7);
        }

        .menu-link.active {
            background: var(--primary);
            color: #fffaf5;
            box-shadow: 0 2px 8px rgba(164, 74, 63, 0.3);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.92rem;
            font-weight: 700;
            border: 1px solid transparent;
            background: var(--primary);
            color: #fffaf5;
            cursor: pointer;
            transition: transform 150ms ease, background 150ms ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 12px;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 1.35rem;
            letter-spacing: -0.02em;
        }

        .add-vehicle-card {
            display: none;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 22px;
            box-shadow: 0 10px 30px rgba(72, 42, 22, 0.08);
            animation: fadeIn 180ms ease-out;
        }

        .add-vehicle-card.visible {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .add-vehicle-card h3 {
            margin: 0 0 14px 0;
            font-size: 1.1rem;
            color: var(--text);
        }

        .add-form-fields {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .add-form-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }

        button.secondary {
            background: rgba(255, 253, 248, 0.72);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .add-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            margin-bottom: 18px;
            align-items: center;
        }

        input {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 11px 12px;
            font: inherit;
            color: var(--text);
            background: rgba(255, 253, 248, 0.95);
        }

        .threshold-grid {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .threshold-grid label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .add-threshold-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .vehicle-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-row {
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .checkbox-row input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: var(--primary);
        }

        .vehicle-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 10px;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.55);
        }

        .badge {
            display: inline-block;
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 6px;
        }

        .badge-active {
            background: #d9efdf;
            color: var(--success);
        }

        .badge-inactive {
            background: #e8ded2;
            color: #765948;
        }

        @media (max-width: 640px) {

            .vehicle-row,
            .add-row,
            header,
            .threshold-grid,
            .add-threshold-grid {
                grid-template-columns: 1fr;
                display: grid;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="site-header">
            <div class="site-title-group">
                <h1>SnapFuel</h1>
                <div class="subtitle">Manage vehicles and threshold settings for fuel logging.</div>
            </div>
            <div class="header-controls">
                <nav class="site-nav" aria-label="Main Navigation">
                    <a class="menu-link" href="/">Review Queue</a>
                    <a class="menu-link active" href="/vehicles.html">Vehicles</a>
                    <a class="menu-link" href="/report.html">Report</a>
                    <a class="menu-link" href="/log.html">Log</a>
                </nav>
            </div>
        </header>

        <div id="status" class="status">Loading vehicles…</div>

        <section class="panel">
            <div class="panel-header">
                <h2>Configured Vehicles</h2>
                <button id="toggleAddVehicleBtn" type="button">+ Add Vehicle</button>
            </div>

            <div id="addVehicleWrapper" class="add-vehicle-card">
                <h3>Add New Vehicle</h3>
                <div class="add-form-fields">
                    <div>
                        <input id="newVehicleName" type="text" placeholder="Vehicle name (e.g. 2018 Ford F-150)"
                            style="width: 100%;" />
                    </div>
                    <div>
                        <label class="checkbox-row">
                            <input id="newVehicleNoOdometer" type="checkbox" />
                            No Odometer (skip odometer check)
                        </label>
                    </div>
                    <div class="add-threshold-grid">
                        <label>
                            Max Gallons (optional callout threshold)
                            <input id="newVehicleMaxGallons" type="number" min="0" step="0.01"
                                placeholder="e.g. 21.5" />
                        </label>
                        <label>
                            Max MPG (optional callout threshold)
                            <input id="newVehicleMaxMpg" type="number" min="0" step="0.01" placeholder="e.g. 50" />
                        </label>
                    </div>
                    <div>
                        <label>
                            Photo description (helps auto detect identify this vehicle)
                            <textarea id="newVehiclePhotoDescription" rows="2" style="width: 100%;"
                                placeholder="e.g. Black Ram 3500 cluster, round white-on-black dials, odometer on a small screen bottom centre"></textarea>
                        </label>
                    </div>
                </div>
                <div class="add-form-actions">
                    <button id="cancelAddVehicleBtn" type="button" class="secondary">Cancel</button>
                    <button id="addVehicleButton" type="button">Save vehicle</button>
                </div>
            </div>

            <div id="vehicleManagerList" class="vehicle-list"></div>
        </section>
    </div>

    <script src="/vehicles.js"></script>
</body>

</html>
