<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapFuel Manual Entry</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe6;
      --bg-accent: #d8c3a5;
      --panel: rgba(255, 250, 242, 0.92);
      --panel-strong: #fffdf8;
      --border: #d9c6b1;
      --text: #2f241c;
      --muted: #6b5a4b;
      --primary: #a44a3f;
      --primary-strong: #7f3229;
      --accent: #24555a;
      --accent-soft: #d7e7e5;
      --success: #2f7d4a;
      --shadow: 0 22px 60px rgba(72, 42, 22, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.65), transparent 28%),
        linear-gradient(135deg, var(--bg), #ead8bf 55%, var(--bg-accent));
      color: var(--text);
      font-family: Aptos, "Trebuchet MS", sans-serif;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .site-title-group h1 {
      margin: 0;
      font-size: clamp(1.9rem, 3.5vw, 2.7rem);
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .site-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 253, 248, 0.65);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .menu-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
      border: 1px solid transparent;
      transition: all 150ms ease;
    }

    .menu-link:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.7);
    }

    .menu-link.active {
      background: var(--primary);
      color: #fffaf5;
      box-shadow: 0 2px 8px rgba(164, 74, 63, 0.3);
    }

    .page-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      border: none;
      background: var(--primary);
      color: #fffaf5;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 700;
      transition: transform 150ms ease, background 150ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button.secondary {
      background: rgba(255, 253, 248, 0.72);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .status {
      min-height: 24px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 22px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .queue-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .queue-filter-group {
      display: flex;
      background: rgba(255, 253, 248, 0.85);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 4px;
    }

    .queue-filter-btn {
      flex: 1;
      padding: 7px 12px;
      min-height: unset;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      border: none;
      box-shadow: none;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .queue-filter-btn:hover {
      color: var(--text);
      transform: none;
    }

    .queue-filter-btn.active {
      background: var(--primary);
      color: #fffaf5;
      box-shadow: 0 2px 6px rgba(164, 74, 63, 0.35);
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 250px);
      overflow: auto;
      padding-right: 4px;
    }

    .queue-item {
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.62);
      border-radius: 18px;
      padding: 14px;
      cursor: pointer;
      transition: border-color 150ms ease, transform 150ms ease, background 150ms ease;
    }

    .queue-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .queue-actions.hidden {
      visibility: hidden;
    }

    .queue-actions button {
      padding: 8px 12px;
      font-size: 0.82rem;
    }

    .queue-item:hover,
    .queue-item.active {
      border-color: rgba(164, 74, 63, 0.35);
      background: var(--panel-strong);
      transform: translateY(-1px);
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-pending {
      background: #f3e1c5;
      color: #8d4b16;
    }

    .badge-saved {
      background: #d9efdf;
      color: var(--success);
    }

    .badge-type {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .queue-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
    }

    .queue-title-main {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .queue-check {
      color: var(--success);
      font-weight: 800;
      line-height: 1;
    }

    .queue-meta,
    .image-meta,
    .group-meta,
    .helper {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .queue-spread-alert {
      color: #b3261e;
      font-weight: 800;
    }

    .queue-count-emphasis {
      font-weight: 800;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(340px, 0.8fr);
      gap: 22px;
    }

    .viewer-panel,
    .form-panel {
      min-height: 680px;
    }

    .viewer-shell {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
    }

    .viewer-top {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-image {
      position: relative;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #f8f2ea, #eadcc9);
      min-height: 460px;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      max-height: 520px;
      object-fit: contain;
      pointer-events: none;
    }

    .magnifier-lens {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(0, 0, 0, 0.2);
      pointer-events: none;
      opacity: 0;
      background-repeat: no-repeat;
      background-color: #fff;
      transition: opacity 120ms ease;
      z-index: 10;
    }

    .magnifier-lens.visible {
      opacity: 1;
    }

    .zoom-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(47, 36, 28, 0.75);
      color: #fffaf5;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      pointer-events: none;
      backdrop-filter: blur(4px);
      z-index: 5;
    }

    .thumb-strip {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .thumb-card {
      position: relative;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.65);
      border-radius: 18px;
      padding: 10px;
      cursor: pointer;
    }

    .thumb-card.active {
      border-color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(164, 74, 63, 0.25);
    }

    .thumb-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 0;
      background: #eadcc9;
      transform-origin: center center;
      transition: transform 150ms ease;
      display: block;
    }

    .thumb-image-frame {
      position: relative;
      margin-bottom: 8px;
      overflow: hidden;
      border-radius: 12px;
    }

    .thumb-focus {
      position: absolute;
      width: 52px;
      height: 52px;
      border: 2px solid rgba(36, 85, 90, 0.95);
      background: rgba(255, 253, 248, 0.18);
      box-shadow: 0 0 0 9999px rgba(36, 85, 90, 0.08);
      opacity: 0;
      pointer-events: none;
    }

    .thumb-focus.visible {
      opacity: 1;
    }

    .form-panel form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-card {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.58);
      border-radius: 18px;
      padding: 16px;
    }

    .section-card h2 {
      margin: 0 0 6px;
      font-size: 1.1rem;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    input,
    select,
    textarea {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 12px;
      font: inherit;
      color: var(--text);
      background: rgba(255, 253, 248, 0.95);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .price-callout {
      padding: 14px 16px;
      background: #f5e9dc;
      border-radius: 18px;
      color: var(--primary-strong);
      font-weight: 700;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 420px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .thumb-time {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.35;
    }

    .thumb-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 2;
    }

    .thumb-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.9);
      border: 1px solid var(--border);
      box-shadow: 0 6px 16px rgba(47, 36, 28, 0.14);
      cursor: pointer;
    }

    .thumb-check input {
      margin: 0;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .viewer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 920px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .queue-list {
        max-height: none;
      }
    }

    @media (max-width: 640px) {
      .container {
        padding: 18px;
      }

      .fields {
        grid-template-columns: 1fr;
      }

      .thumb-strip {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="site-header">
      <div class="site-title-group">
        <h1>SnapFuel</h1>
        <div class="subtitle">Review and categorize fuel receipts & odometer captures.</div>
      </div>
      <div class="header-controls">
        <div class="page-actions">
          <button id="scanButton" type="button">Scan Photos</button>
          <button id="refreshButton" type="button" class="secondary">Refresh</button>
        </div>
        <nav class="site-nav" aria-label="Main Navigation">
          <a class="menu-link active" href="/">Review Queue</a>
          <a class="menu-link" href="/vehicles.html">Vehicles</a>
          <a class="menu-link" href="/report.html">Report</a>
          <a class="menu-link" href="/log.html">Log</a>
        </nav>
      </div>
    </header>

    <div id="status" class="status">Loading grouped images…</div>

    <div class="layout">
      <aside class="panel queue-panel">
        <div class="queue-title">
          <strong>Review Queue</strong>
          <span id="queueSummary" class="queue-meta"></span>
        </div>
        <div class="queue-filter-group" role="group" aria-label="Filter review queue">
          <button type="button" class="queue-filter-btn active" data-filter="all">All</button>
          <button type="button" class="queue-filter-btn" data-filter="pending">Pending</button>
        </div>
        <div id="groupList" class="queue-list"></div>
      </aside>

      <section class="workspace">
        <div class="panel viewer-panel">
          <div id="viewerShell" class="viewer-shell"></div>
        </div>

        <div class="panel form-panel">
          <form id="entryForm">
            <div>
              <strong>Fuel-stop record</strong>
            </div>

            <div class="section-card">
              <h2>Fuel purchase details</h2>
              <div class="fields">
                <label>
                  Dollars
                  <input id="totalPrice" name="totalPrice" type="number" step="0.01" />
                </label>

                <label>
                  Gallons
                  <input id="gallons" name="gallons" type="number" step="0.001" />
                </label>

                <label class="full-width">
                  Location name
                  <input id="locationName" name="locationName" type="text" />
                </label>
              </div>
            </div>

            <div class="section-card">
              <h2>Dashboard details</h2>
              <div class="fields">
                <label>
                  Vehicle
                  <select id="vehicleId" name="vehicleId"></select>
                </label>

                <label>
                  Odometer
                  <input id="odometer" name="odometer" type="number" step="1" />
                </label>
              </div>
            </div>

            <div class="section-card">
              <h2>Notes</h2>
              <div class="fields">
                <label class="full-width">
                  Group notes
                  <textarea id="notes" name="notes"></textarea>
                </label>
              </div>
            </div>

            <div id="pricePerGallonDisplay" class="price-callout">Price per gallon will be calculated after gallons and
              dollars are entered.</div>

            <label>
              Reviewer name
              <input id="reviewerName" name="reviewerName" type="text" />
            </label>

            <div class="actions">
              <div id="groupMeta" class="group-meta"></div>
              <button id="saveButton" type="submit">Save group</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>

  <script src="/app.js"></script>
</body>

</html>
