<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapFuel Event Log</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5efe4;
            --bg-alt: #dac8a9;
            --panel: rgba(255, 252, 246, 0.94);
            --border: #d7c3a7;
            --text: #2e241d;
            --muted: #67574a;
            --primary: #9d3b2e;
            --warn: #a53f2a;
            --warn-soft: #f9e1d9;
            --shadow: 0 20px 56px rgba(64, 41, 23, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 92% 10%, rgba(255, 255, 255, 0.65), transparent 24%),
                linear-gradient(140deg, var(--bg), #ecdfca 54%, var(--bg-alt));
            color: var(--text);
            font-family: Aptos, "Trebuchet MS", sans-serif;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px;
        }

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .site-title-group h1 {
            margin: 0;
            font-size: clamp(1.9rem, 3.5vw, 2.7rem);
            letter-spacing: -0.05em;
        }

        .subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .status {
            color: var(--muted);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .site-nav {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 253, 248, 0.65);
            padding: 4px;
            border-radius: 999px;
            border: 1px solid var(--border);
        }

        .menu-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 16px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--muted);
            border: 1px solid transparent;
            transition: all 150ms ease;
        }

        .menu-link:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.7);
        }

        .menu-link.active {
            background: var(--primary);
            color: #fffaf5;
            box-shadow: 0 2px 8px rgba(164, 74, 63, 0.3);
        }

        .page-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filters {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        button,
        select {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid var(--border);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
            background: rgba(255, 252, 246, 0.78);
        }

        button {
            background: var(--primary);
            color: #fff9f4;
            border-color: transparent;
            cursor: pointer;
            transition: transform 150ms ease, background 150ms ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button.secondary {
            background: rgba(255, 253, 248, 0.72);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 16px;
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1180px;
        }

        th,
        td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid rgba(103, 87, 74, 0.18);
            font-size: 0.9rem;
            vertical-align: top;
        }

        th {
            font-size: 0.78rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .pill {
            display: inline-block;
            border-radius: 999px;
            padding: 3px 8px;
            font-size: 0.74rem;
            border: 1px solid rgba(103, 87, 74, 0.25);
        }

        .pill-review {
            background: #f1e6d5;
        }

        .pill-approved {
            background: #e2f0e6;
            color: #2f7d4a;
            border-color: rgba(47, 125, 74, 0.3);
        }

        .row-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
        }

        .row-actions button,
        .row-actions a {
            min-height: unset;
            padding: 5px 10px;
            font-size: 0.78rem;
        }

        .warn {
            color: var(--warn);
            font-weight: 700;
            background: var(--warn-soft);
            border: 1px solid rgba(165, 63, 42, 0.24);
            border-radius: 10px;
            padding: 5px 8px;
            margin-bottom: 4px;
            display: block;
        }

        .empty {
            color: var(--muted);
            padding: 14px 0;
        }

        @media (max-width: 920px) {
            .container {
                padding: 18px;
            }

            header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="site-header">
            <div class="site-title-group">
                <h1>SnapFuel</h1>
                <div class="subtitle">Chronological event log with gallon and MPG callouts.</div>
            </div>
            <div class="header-controls">
                <div class="page-actions">
                    <button id="refreshButton" type="button" class="secondary">Refresh</button>
                </div>
                <nav class="site-nav" aria-label="Main Navigation">
                    <a class="menu-link" href="/">Review Queue</a>
                    <a class="menu-link" href="/vehicles.html">Vehicles</a>
                    <a class="menu-link" href="/report.html">Report</a>
                    <a class="menu-link active" href="/log.html">Log</a>
                </nav>
            </div>
        </header>

        <div class="filters">
            <select id="vehicleFilter" aria-label="Filter by vehicle">
                <option value="">All Vehicles</option>
            </select>
            <select id="anomalyFilter">
                <option value="all">All Events</option>
                <option value="onlyAnomalies">Only Callouts</option>
                <option value="onlyWithoutImages">No Images</option>
            </select>
        </div>

        <div id="status" class="status">Loading event log…</div>

        <section class="panel">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Vehicle</th>
                        <th>Gallons</th>
                        <th>Odometer</th>
                        <th>Miles Since Prior</th>
                        <th>MPG</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Callouts</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="logBody"></tbody>
            </table>
        </section>
    </div>

    <script src="/log.js"></script>
</body>

</html>
